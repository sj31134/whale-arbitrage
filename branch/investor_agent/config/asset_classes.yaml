    key_metrics: ["land_share_ratio", "orientation_view", "centrality_travel_time", "zoning_density", "buyer_cash_ratio"]
    benchmark_assets:
      - name: "Hannam UN Village Prime Land"
        ticker: "RE-HANNAM-UN"
        category: "Prime Geographic Monopoly"
      - name: "Apgujeong Modern Waterfront Plot"
        ticker: "RE-APGUJEONG-HYUNDAI"
        category: "Prime Reconstruction Monopoly"

  equities_infrastructure:
